services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      VENDOROPS_DATA_DIR: /data
      VENDOROPS_VECTOR_STORE: sqlite
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    command: [python, -m, streamlit, run, frontend/app.py, --server.address, 0.0.0.0, --server.headless, "true", --browser.gatherUsageStats, "false"]
    environment:
      VENDOROPS_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
  worker:
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: [python, -m, backend.worker]
    env_file: ../.env
    environment:
      VENDOROPS_DATA_DIR: /data
      VENDOROPS_VECTOR_STORE: sqlite
    volumes:
      - app-data:/data
    restart: unless-stopped
volumes:
  app-data:
