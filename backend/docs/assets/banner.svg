      <rect x="94" width="87" height="29" rx="7" fill="#173847" stroke="#285361"/>
      <text x="108" y="19" fill="#d5e7ec">FASTAPI</text>
      <rect x="193" width="104" height="29" rx="7" fill="#173847" stroke="#285361"/>
      <text x="207" y="19" fill="#d5e7ec">STREAMLIT</text>
    </g>
    <g transform="translate(832 61)">
      <rect x="47" y="0" width="206" height="232" rx="14" fill="#13313e" stroke="#2c4c5b" transform="rotate(8 150 116)"/>
      <rect x="13" y="15" width="206" height="232" rx="14" fill="#112b38" stroke="#3b5b69"/>
      <text x="37" y="54" fill="#8ba5b5" font-size="10" font-weight="600" letter-spacing="2">SOURCE DOCUMENT</text>
      <rect x="37" y="76" width="112" height="7" rx="3.5" fill="#365363"/>
      <rect x="37" y="95" width="151" height="5" rx="2.5" fill="#294553"/>
      <rect x="37" y="111" width="136" height="5" rx="2.5" fill="#294553"/>
      <path d="M37 142H191M37 170H191M37 198H191" stroke="#294553"/>
      <path d="M137 134V211" stroke="#294553"/>
      <rect x="154" y="150" width="26" height="5" rx="2.5" fill="#5eead4" opacity=".6"/>
      <rect x="154" y="179" width="26" height="5" rx="2.5" fill="#5eead4" opacity=".6"/>
      <g transform="translate(163 193)">
        <rect width="176" height="54" rx="12" fill="#0e4946" stroke="#2c8175"/>
        <circle cx="27" cy="27" r="12" fill="#5eead4"/>
        <path d="m21 27 4 4 8-8" stroke="#0e4946" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="49" y="24" fill="#c8fff3" font-size="11" font-weight="600">REVIEW BEFORE ACTION</text>
        <text x="49" y="39" fill="#8bc8bb" font-size="10">Every decision has a source.</text>
