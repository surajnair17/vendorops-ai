<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">VendorOps AI</title>
  <desc id="desc">Vendor documents. Clear decisions. Extract, compare, apply policy, review, and approve.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102a3b"/>
      <stop offset="1" stop-color="#091a27"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8babb9" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <path d="M0 340H1280" stroke="#5eead4" stroke-opacity=".15"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="58" y="63" fill="#7dd3c8" font-size="12" font-weight="700" letter-spacing="3">DOCUMENT INTELLIGENCE / HUMAN OVERSIGHT</text>
    <text x="54" y="145" fill="#f1f5f9" font-size="66" font-weight="750" letter-spacing="-3">VendorOps <tspan fill="#5eead4">AI</tspan></text>
    <text x="58" y="194" fill="#d0dee6" font-size="25" letter-spacing="-.4">Vendor documents. Clear decisions.</text>
    <text x="58" y="244" fill="#95aebd" font-size="15">Extract → Compare → Apply policy → Review → Approve</text>
    <g transform="translate(58 281)" font-size="11" font-weight="600" letter-spacing=".5">
      <rect width="82" height="29" rx="7" fill="#173847" stroke="#285361"/>
