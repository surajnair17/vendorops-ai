<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">VendorOps AI — vendor documents, clear decisions</title>
  <desc id="desc">A document-review workspace. Extract PDFs and scans, compare an invoice with a purchase order, cite policy evidence, and approve the next step. Illustrative example: 12.50 to 13.50 is an 8 percent price variance.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102c3a"/>
      <stop offset="1" stop-color="#091923"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b3d2df" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#background)"/>
  <rect width="1280" height="400" rx="20" fill="url(#grid)"/>
  <path d="M58 346H732" stroke="url(#accent)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="58" y="43" width="8" height="8" rx="2" fill="#5eead4"/>
    <text x="78" y="52" fill="#9cb9c7" font-size="12" font-weight="600" letter-spacing="2.1">DOCUMENT REVIEW / HUMAN OVERSIGHT</text>
    <text x="54" y="142" fill="#f3f7fa" font-size="70" font-weight="700" letter-spacing="-3">VendorOps <tspan fill="#5eead4">AI</tspan></text>
    <text x="58" y="190" fill="#dbe8ee" font-size="25" letter-spacing="-.5">Extract the document. Check the numbers.</text>
    <text x="58" y="226" fill="#dbe8ee" font-size="25" letter-spacing="-.5">Approve the next step.</text>
    <text x="58" y="277" fill="#9cb9c7" font-size="15">Invoices · Purchase orders · Quotations · Policy evidence</text>
    <text x="58" y="316" fill="#65d9c5" font-size="12" font-weight="600" letter-spacing="1.4">PYTHON  /  FASTAPI  /  STREAMLIT  /  SQLITE</text>
    <text x="58" y="373" fill="#8ca9b8" font-size="12">Real PDF &amp; OCR · Deterministic checks · Revision-bound approvals</text>
    <g transform="translate(817 47)">
      <rect x="12" y="-7" width="378" height="302" rx="17" fill="#13313e" stroke="#284652" transform="rotate(3 201 144)"/>
      <rect width="378" height="302" rx="15" fill="#102733" stroke="#36525f"/>
      <text x="26" y="36" fill="#a0bac8" font-size="11" font-weight="600" letter-spacing="1.5">ILLUSTRATIVE REVIEW</text>
      <circle cx="346" cy="31" r="4" fill="#5eead4"/>
      <path d="M26 55H352" stroke="#2a4553"/>
      <text x="26" y="88" fill="#b5cbd6" font-size="13">PO unit price</text>
      <text x="352" y="88" fill="#eef5f8" font-size="20" font-weight="600" text-anchor="end">$12.50</text>
      <text x="26" y="123" fill="#b5cbd6" font-size="13">Invoice unit price</text>
      <text x="352" y="123" fill="#eef5f8" font-size="20" font-weight="600" text-anchor="end">$13.50</text>
      <rect x="26" y="147" width="326" height="49" rx="8" fill="#302b21" stroke="#756044"/>
      <text x="41" y="176" fill="#f5cb86" font-size="13" font-weight="600">8% variance</text>
      <text x="335" y="176" fill="#d5bc92" font-size="12" text-anchor="end">5% confirmed tolerance</text>
      <text x="26" y="229" fill="#a0bac8" font-size="12">Source evidence retained</text>
      <path d="m325 224 5 5 10-11" stroke="#5eead4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="248" width="326" height="32" rx="7" fill="#143e3d" stroke="#2f6d63"/>
      <text x="189" y="269" fill="#b9f3e5" font-size="12" font-weight="600" text-anchor="middle">Review required before follow-up</text>
    </g>
  </g>
</svg>
