name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VENDOROPS_LIVE_CALLS_ENABLED: 'false'
      VENDOROPS_LIVE_SEND_ENABLED: 'false'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install --require-hashes -r backend/requirements-lock.txt -r frontend/requirements-lock.txt
      - run: pip install -r backend/requirements-dev.txt -r backend/requirements-cloud.txt -r frontend/requirements-dev.txt
      - run: mkdir -p backend/artifacts && python -m pip_audit --local --strict --progress-spinner off --format json --output backend/artifacts/dependency-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: backend/artifacts/dependency-audit.json
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m backend.scripts.smoke
      - run: python -m backend.scripts.generate_samples
      - run: python -m backend.scripts.evaluate
      - run: python -m backend.scripts.evaluate_retrieval
      - run: python -m backend.scripts.evaluate_ocr
      - uses: actions/upload-artifact@v7
        with:
          name: offline-evaluation
          path: backend/artifacts/*evaluation.json
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r backend/infra/requirements.txt
      - run: cfn-lint backend/infra/cloudformation.yaml
      - run: cp backend/.env.example backend/.env
      - run: docker compose -f backend/infra/compose.yaml config --quiet
      - name: Validate Sydney AWS Compose configuration without calling AWS
        env:
          VENDOROPS_AWS_REGION: ap-southeast-2
          VENDOROPS_LOG_GROUP: /vendorops/ci-validation
        run: docker compose --env-file backend/.env -f backend/infra/compose.yaml -f backend/infra/compose.aws.yaml config --quiet
      - run: docker compose -f backend/infra/compose.yaml build
      - run: docker compose -f backend/infra/compose.yaml up --detach --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:8000/health && curl --fail http://127.0.0.1:8501/_stcore/health
      - name: Verify actual container API, SQLite retrieval, Tesseract, and separate worker
        run: docker compose -f backend/infra/compose.yaml exec -T backend python -m backend.scripts.check_runtime
      - if: always()
        run: docker compose -f backend/infra/compose.yaml down
  guard:
    name: AWS Guard advisory report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aws-cloudformation/aws-guard-rules-registry
          ref: 7f7340c26ae5d5e8874651dbffeb12e0e9f505b6
          path: backend/artifacts/aws/guard/rules-registry
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/infra/guard/package-lock.json
      - run: npm --prefix backend/infra/guard ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix backend/infra/guard test
      - name: Publish findings for review; this is not a compliance pass
        run: npm --prefix backend/infra/guard run check -- --report-only
      - uses: actions/upload-artifact@v7
        with:
          name: aws-guard-findings
          path: backend/artifacts/aws/guard/report.sarif.json
