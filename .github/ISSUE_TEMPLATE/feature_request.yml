name: Feature request
description: Suggest an improvement to the document-review workflow or learning experience.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who would use it and a concrete scenario.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the intended result and any alternatives you considered.
    validations:
      required: true
